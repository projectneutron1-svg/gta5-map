<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GTA V – San Andreas Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --bg:#0d1117;--sidebar:#0d1117;--panel:#161b22;--border:rgba(255,255,255,0.07);
  --text:#e6edf3;--muted:#8b949e;--accent:#f7c948;--hover:rgba(255,255,255,0.04);
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);}
#app{display:flex;height:100vh;}
#sidebar{width:360px;min-width:360px;height:100%;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border);z-index:10;overflow:hidden;position:relative;}
#map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;background:#0a0e14;}
#sb-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0;}
#sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#sb-logo .icon{font-size:22px;}
#sb-logo h1{font-size:15px;font-weight:800;letter-spacing:.3px;color:var(--accent);}
#sb-logo h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0;}
#search-wrap{position:relative;}
#search-input{width:100%;height:36px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:0 12px 0 34px;outline:none;transition:border-color .2s;}
#search-input:focus{border-color:rgba(247,201,72,.4);}
#search-input::placeholder{color:var(--muted);}
#search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}
#search-results{display:none;margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:220px;overflow-y:auto;}
#search-results::-webkit-scrollbar{width:3px;}
#search-results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.sr-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s;}
.sr-item:last-child{border:none;}
.sr-item:hover{background:rgba(255,255,255,.06);}
.sr-name{font-size:12px;font-weight:600;color:var(--text);}
.sr-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;}
.sr-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
#progress-bar{padding:10px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.prog-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.prog-count{font-size:11px;color:var(--accent);font-weight:700;}
.prog-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#f7c948,#fb923c);border-radius:2px;transition:width .4s ease;}
#tree-wrap{flex:1;overflow-y:auto;padding:8px 0;transition:padding-bottom .3s ease;}
#tree-wrap.card-open{padding-bottom:200px;}
#tree-wrap::-webkit-scrollbar{width:3px;}
#tree-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}
.tree-cat{margin-bottom:2px;}
.tree-cat-header{display:flex;align-items:center;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.3px;transition:background .12s;user-select:none;gap:8px;}
.tree-cat-header:hover{background:rgba(255,255,255,.04);}
.tree-cat-header .cat-arrow{margin-left:auto;font-size:10px;color:var(--muted);transition:transform .2s;transform:rotate(0deg);}
.tree-cat-header.open .cat-arrow{transform:rotate(90deg);}
.tree-cat-header .cat-check{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(255,255,255,.2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tree-cat-header .cat-check.checked{border-color:currentColor;background:currentColor;}
.tree-cat-header .cat-check.checked::after{content:'✓';font-size:9px;color:#000;font-weight:900;}
.cat-count{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px;}
.tree-items{display:none;padding:0 0 4px 0;}
.tree-items.open{display:block;}
.tree-item{display:flex;align-items:center;padding:6px 16px 6px 40px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .1s;gap:8px;border-left:2px solid transparent;}
.tree-item:hover{background:var(--hover);color:var(--text);border-left-color:rgba(255,255,255,.15);}
.tree-item.active{background:rgba(255,255,255,.06);color:var(--text);}
.tree-item .item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tree-item .item-name{flex:1;line-height:1.3;}
.item-done{width:13px;height:13px;border-radius:3px;border:1.5px solid rgba(255,255,255,.15);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-left:auto;}
.item-done:hover{border-color:rgba(52,211,153,.5);}
.item-done.checked{background:#34d399;border-color:#34d399;}
.item-done.checked::after{content:'✓';font-size:7px;color:#000;font-weight:900;}
#detail-card{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0;max-height:0;flex-shrink:0;z-index:20;}
#detail-card.visible{opacity:1;max-height:360px;}
#detail-inner{padding:14px 16px 14px;overflow-y:auto;max-height:320px;}
#detail-inner::-webkit-scrollbar{width:3px;}
#detail-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
#dc-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;z-index:21;padding:2px 6px;border-radius:4px;}
#dc-close:hover{background:rgba(255,255,255,.08);color:var(--text);}
#dc-tag{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px;}
#dc-title{font-size:14px;font-weight:800;margin-bottom:6px;line-height:1.3;}
#dc-char{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;}
#dc-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
#dc-imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
#dc-imgs::-webkit-scrollbar{height:3px;}
#dc-imgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
#dc-imgs img{height:90px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);}
#dc-imgs img:hover{transform:scale(1.02);transition:transform .2s;}
#map-controls{position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.mc-btn{height:32px;padding:0 12px;background:rgba(10,12,16,0.92);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;backdrop-filter:blur(10px);}
.mc-btn:hover{background:rgba(255,255,255,.08);}
.mc-btn.active{background:rgba(247,201,72,.12);border-color:rgba(247,201,72,.3);color:var(--accent);}
#tile-row{display:flex;gap:5px;}
#coords{position:absolute;bottom:8px;right:8px;z-index:1000;background:rgba(10,12,16,0.88);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:10px;font-family:monospace;color:var(--muted);pointer-events:none;}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;}
.leaflet-control-zoom a{background:rgba(10,12,16,.92)!important;color:#c9d1d9!important;border-bottom:1px solid var(--border)!important;width:30px!important;height:30px!important;line-height:30px!important;}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.1)!important;}
.leaflet-control-attribution{background:rgba(10,12,16,.7)!important;color:#444!important;font-size:9px!important;}
.leaflet-popup-content-wrapper{background:#161b22!important;border:1px solid var(--border)!important;border-radius:12px!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;min-width:180px;}
.leaflet-popup-tip{background:#161b22!important;}
.leaflet-popup-content{margin:0!important;color:var(--text)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;top:8px!important;right:8px!important;font-size:16px!important;}
.lpu{padding:12px 14px;}
.lpu-tag{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;}
.lpu-title{font-size:12px;font-weight:700;line-height:1.35;margin-bottom:4px;}
.lpu-char{font-size:10px;color:var(--accent);margin-bottom:3px;}
.lpu-hint{font-size:10px;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sb-header">
      <div id="sb-logo">
        <span class="icon">🗺</span>
        <h1>GTA V<small>San Andreas Interactive Map</small></h1>
      </div>
      <div id="search-wrap">
        <span id="search-icon">🔍</span>
        <input id="search-input" placeholder="Search locations, missions, collectibles…" autocomplete="off"/>
      </div>
      <div id="search-results"></div>
    </div>
    <div id="progress-bar">
      <div class="prog-row"><span class="prog-label">📋 Completion</span><span class="prog-count" id="prog-text">0 / 0</span></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button id="btn-expand-all" style="flex:1;height:24px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.3px;transition:background .15s;" onmouseover="this.style.background='rgba(255,255,255,.09)'" onmouseout="this.style.background='rgba(255,255,255,.05)'">▼ Expand All</button>
        <button id="btn-collapse-all" style="flex:1;height:24px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.3px;transition:background .15s;" onmouseover="this.style.background='rgba(255,255,255,.09)'" onmouseout="this.style.background='rgba(255,255,255,.05)'">▶ Collapse All</button>
      </div>
    </div>
    <div id="tree-wrap"></div>
    <div id="detail-card">
      <button id="dc-close">✕</button>
      <div id="detail-inner">
        <div id="dc-tag"></div>
        <div id="dc-title"></div>
        <div id="dc-char"></div>
        <div id="dc-desc"></div>
        <div id="dc-imgs"></div>
      </div>
    </div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-controls">
      <div id="tile-row">
        <button class="mc-btn active" data-t="sat">🛰 Satellite</button>
        <button class="mc-btn" data-t="road">🛣 Road</button>
      </div>
    </div>
    <div id="coords">Hover for coords</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

// ─── MAP SETUP ────────────────────────────────────────────────────────────────
// The GTA V tile set from gta5-map.github.io uses standard Leaflet lat/lng.
// The San Andreas map occupies approximately:
//   Latitude (North-South):  ~54° to ~87°
//   Longitude (East-West):   ~-162° to ~-83°
// We set maxBounds to prevent panning outside the ocean area that surrounds SA.

const BOUNDS_SW = [50, -168];  // south-west corner (ocean edge)
const BOUNDS_NE = [90, -75];   // north-east corner (ocean edge)
const MAP_BOUNDS = L.latLngBounds(BOUNDS_SW, BOUNDS_NE);

const map = L.map('map', {
  minZoom: 3,
  maxZoom: 7,
  zoomControl: true,
  maxBounds: MAP_BOUNDS,
  maxBoundsViscosity: 1.0   // hard stop — cannot drag outside bounds at all
});
map.zoomControl.setPosition('bottomright');

const tSat = L.tileLayer('https://gta5-map.github.io/tiles/satellite/{z}-{x}_{y}.png',{
  tileSize:256, maxZoom:7, minZoom:3, noWrap:true,
  attribution:'© GTA V fan map tiles'
});
const tRoad = L.tileLayer('https://gta5-map.github.io/tiles/road/{z}-{x}_{y}.png',{
  tileSize:256, maxZoom:7, minZoom:3, noWrap:true,
  attribution:'© GTA V fan map tiles'
});
tSat.addTo(map);
let activeTile = 'sat';
map.setView([70, -119], 4);

// Fix black/empty map area — invalidate size on any layout change
window.addEventListener('resize', () => map.invalidateSize());
map.on('zoomend', () => map.invalidateSize());
map.on('zoomstart', () => setTimeout(() => map.invalidateSize(), 50));
// Also fix on initial load in case the container rendered late
setTimeout(() => map.invalidateSize(), 100);

document.querySelectorAll('[data-t]').forEach(b => {
  b.onclick = () => {
    if(b.dataset.t === activeTile) return;
    activeTile === 'sat' ? map.removeLayer(tSat) : map.removeLayer(tRoad);
    activeTile = b.dataset.t;
    activeTile === 'sat' ? tSat.addTo(map) : tRoad.addTo(map);
    document.querySelectorAll('[data-t]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  };
});

// ─── COMPLETION TRACKING ──────────────────────────────────────────────────────
const STORAGE_KEY = 'gtav_map_done_v2';
function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e) { return new Set(); }
}
function saveDone(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){}
}
const doneSet = loadDone();
function updateProgress() {
  const total = LOCS.length;
  const done = doneSet.size;
  document.getElementById('prog-text').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = total ? `${(done/total)*100}%` : '0%';
}
updateProgress();

// ─── MARKERS ─────────────────────────────────────────────────────────────────
function mkIcon(locOrType, done) {
  // Accept either a full loc object or just a type string (for tree icons)
  const c = (typeof locOrType === 'object') ? getMissionColor(locOrType) : (COLORS[locOrType] || '#aaa');
  const opacity = done ? '0.4' : '1';
  const extra = done ? 'filter:grayscale(80%);' : '';
  const sz = 12; // slightly larger for visibility
  return L.divIcon({
    html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};border:2px solid rgba(0,0,0,0.6);box-shadow:0 0 6px ${c}99;cursor:pointer;opacity:${opacity};${extra}"></div>`,
    className: '', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-8]
  });
}

const groups = {};
const typeList = [...new Set(LOCS.map(l => l.type))].sort();
typeList.forEach(t => { groups[t] = L.layerGroup().addTo(map); });

const markerMap = new Map();
LOCS.forEach((loc, idx) => {
  const c = getMissionColor(loc);
  const isDone = doneSet.has(idx);
  const m = L.marker([loc.lat, loc.lng], { icon: mkIcon(loc, isDone) });
  m.bindPopup(`<div class="lpu">
    <div class="lpu-tag" style="color:${c}">${EMOJI[loc.type]||'📍'} ${loc.type}</div>
    <div class="lpu-title">${loc.title}</div>
    ${loc.char ? `<div class="lpu-char">Character: ${loc.char}</div>` : ''}
    <div class="lpu-hint">Click sidebar entry for details</div>
  </div>`, {maxWidth:240});
  m.on('click', () => showDetail(idx));
  m.addTo(groups[loc.type]);
  markerMap.set(idx, m);
});

// ─── SIDEBAR TREE ─────────────────────────────────────────────────────────────
const treeWrap = document.getElementById('tree-wrap');
const activeTypes = new Set(typeList);

function refreshMarkerIcon(idx) {
  const m = markerMap.get(idx);
  if(m) m.setIcon(mkIcon(LOCS[idx], doneSet.has(idx)));
}

function buildTree() {
  treeWrap.innerHTML = '';
  Object.entries(CAT_GROUPS).forEach(([groupName, types]) => {
    const validTypes = types.filter(t => typeList.includes(t));
    if(!validTypes.length) return;
    const catDiv = document.createElement('div');
    catDiv.className = 'tree-cat';
    const header = document.createElement('div');
    header.className = 'tree-cat-header';
    const check = document.createElement('div');
    check.className = 'cat-check checked';
    const allActive = validTypes.every(t => activeTypes.has(t));
    if(!allActive) check.classList.remove('checked');
    const totalCount = validTypes.reduce((s,t) => s + LOCS.filter(l=>l.type===t).length, 0);
    header.innerHTML = '';
    header.appendChild(check);
    const labelSpan = document.createElement('span');
    labelSpan.innerHTML = `${groupName} <span class="cat-count">${totalCount}</span>`;
    header.appendChild(labelSpan);
    const arrow = document.createElement('span');
    arrow.className = 'cat-arrow'; arrow.textContent = '▶';
    header.appendChild(arrow);
    header.classList.add('open');

    // Declare itemsList here so check.onclick can safely reference it
    const itemsList = document.createElement('div');
    itemsList.className = 'tree-items open';

    // Helper: sync parent checkbox to whether all sub-types are active
    const syncParentCheck = () => {
      const allOn = validTypes.every(t => activeTypes.has(t));
      const anyOn = validTypes.some(t => activeTypes.has(t));
      if(allOn) check.classList.add('checked');
      else check.classList.remove('checked');
    };

    check.onclick = (e) => {
      e.stopPropagation();
      const nowChecked = check.classList.contains('checked');
      if(nowChecked) {
        check.classList.remove('checked');
        validTypes.forEach(t => { activeTypes.delete(t); map.removeLayer(groups[t]); });
        itemsList.querySelectorAll('.type-check').forEach(tc => tc.classList.remove('checked'));
      } else {
        check.classList.add('checked');
        validTypes.forEach(t => { activeTypes.add(t); groups[t].addTo(map); });
        itemsList.querySelectorAll('.type-check').forEach(tc => tc.classList.add('checked'));
      }
    };
    header.onclick = (e) => {
      if(e.target === check) return;
      const isOpen = itemsList.classList.contains('open');
      itemsList.classList.toggle('open');
      if(isOpen) header.classList.remove('open');
      else header.classList.add('open');
    };

    validTypes.forEach(type => {
      const c = COLORS[type] || '#aaa';
      const cnt = LOCS.filter(l=>l.type===type).length;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;padding:4px 16px 4px 16px;gap:8px;';
      const tc = document.createElement('div');
      tc.className = 'cat-check type-check checked';
      tc.style.cssText = `width:13px;height:13px;border-radius:3px;border:1.5px solid ${c};flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;`;
      tc.innerHTML = `<span style="font-size:8px;color:#000;font-weight:900;display:none;">✓</span>`;
      const updateCheck = () => {
        const on = activeTypes.has(type);
        tc.style.background = on ? c : 'transparent';
        tc.querySelector('span').style.display = on ? '' : 'none';
      };
      updateCheck();
      tc.onclick = () => {
        if(activeTypes.has(type)){ activeTypes.delete(type); map.removeLayer(groups[type]); }
        else { activeTypes.add(type); groups[type].addTo(map); }
        updateCheck();
        syncParentCheck();
      };
      const typeLabel = document.createElement('div');
      typeLabel.style.cssText = 'font-size:11px;flex:1;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:default;';
      typeLabel.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${c};display:inline-block;flex-shrink:0;"></span><span>${EMOJI[type]||''} ${type}</span>`;
      const cntBadge = document.createElement('span');
      cntBadge.style.cssText = 'font-size:10px;color:var(--muted);font-weight:400;';
      cntBadge.textContent = cnt;
      row.appendChild(tc); row.appendChild(typeLabel); row.appendChild(cntBadge);
      itemsList.appendChild(row);

      // Named sub-items with completion checkboxes
      const typeItems = LOCS.filter((l,i) => l.type===type && (l.desc || l.title));
      if(typeItems.length <= 60 && typeItems.length > 0) {
        typeItems.forEach((loc) => {
          const realIdx = LOCS.indexOf(loc);
          const item = document.createElement('div');
          item.className = 'tree-item';
          if(doneSet.has(realIdx)) item.style.opacity = '0.45';
          item.dataset.idx = realIdx;
          const dot = `<div class="item-dot" style="background:${c}"></div>`;
          const name = `<span class="item-name">${loc.title}</span>`;
          const doneBox = `<div class="item-done${doneSet.has(realIdx)?' checked':''}"></div>`;
          item.innerHTML = dot + name + doneBox;
          // click name/dot area → fly + detail
          item.addEventListener('click', (e) => {
            if(e.target.classList.contains('item-done')) return;
            document.querySelectorAll('.tree-item').forEach(x=>x.classList.remove('active'));
            item.classList.add('active');
            flyTo(realIdx);
            showDetail(realIdx);
          });
          // click checkbox → toggle done
          item.querySelector('.item-done').addEventListener('click', (e) => {
            e.stopPropagation();
            const box = e.target;
            if(doneSet.has(realIdx)) {
              doneSet.delete(realIdx);
              box.classList.remove('checked');
              item.style.opacity = '1';
            } else {
              doneSet.add(realIdx);
              box.classList.add('checked');
              item.style.opacity = '0.45';
            }
            saveDone(doneSet);
            updateProgress();
            refreshMarkerIcon(realIdx);
          });
          itemsList.appendChild(item);
        });
      }
    });
    catDiv.appendChild(header);
    catDiv.appendChild(itemsList);
    treeWrap.appendChild(catDiv);
  });
}
buildTree();

// Expand / Collapse All — safe wiring after buildTree populates the DOM
const btnExp = document.getElementById('btn-expand-all');
const btnCol = document.getElementById('btn-collapse-all');
if(btnExp) btnExp.onclick = () => {
  document.querySelectorAll('.tree-items').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.tree-cat-header').forEach(el => el.classList.add('open'));
};
if(btnCol) btnCol.onclick = () => {
  document.querySelectorAll('.tree-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.tree-cat-header').forEach(el => el.classList.remove('open'));
};

// ─── FLY TO + DETAIL ─────────────────────────────────────────────────────────
const ZOOM_FOR_TYPE = {
  "Spaceship Part":7,"Nuclear Waste":7,"Hidden Package":7,
  "Easter Egg":7,"Epsilon Car":7,"Epsilon Tract":7,
  "Safehouse":7,"Hospital":7,"Police Station":7,"Airport":6,
  "Landmark":5,"Gang Territory":5,"Property":6,"Activity":6,
  "Main Mission":6,"Heist Setup":6,"Strangers & Freaks":6,"Assassination":6,
  "Vehicle Spawn":7
};
function flyTo(idx) {
  const loc = LOCS[idx];
  const z = ZOOM_FOR_TYPE[loc.type] || 6;
  map.flyTo([loc.lat, loc.lng], z, {duration:0.8});
}

function showDetail(idx) {
  const loc = LOCS[idx];
  const c = getMissionColor(loc);
  document.getElementById('dc-tag').innerHTML = `<span style="color:${c}">${EMOJI[loc.type]||'📍'} ${loc.type}</span>`;
  document.getElementById('dc-title').textContent = loc.title;
  const charEl = document.getElementById('dc-char');
  if(loc.char) {
    charEl.textContent = `Character: ${loc.char}`;
    charEl.style.color = getMissionColor(loc);
  } else {
    charEl.textContent = '';
    charEl.style.color = '';
  }
  document.getElementById('dc-desc').textContent = loc.desc || 'No description available.';
  const imgBox = document.getElementById('dc-imgs');
  imgBox.innerHTML = '';
  if(loc.imgs && loc.imgs.length) {
    loc.imgs.forEach(url => {
      const img = document.createElement('img');
      img.src = url; img.alt = loc.title;
      img.onerror = () => img.style.display='none';
      imgBox.appendChild(img);
    });
  }
  document.getElementById('detail-card').classList.add('visible');
  document.getElementById('tree-wrap').classList.add('card-open');
  setTimeout(() => {
    const m = markerMap.get(idx);
    if(m) m.openPopup();
  }, 850);
}

document.getElementById('dc-close').onclick = () => {
  document.getElementById('detail-card').classList.remove('visible');
  document.getElementById('tree-wrap').classList.remove('card-open');
  document.querySelectorAll('.tree-item').forEach(x => x.classList.remove('active'));
};

// ─── SEARCH ───────────────────────────────────────────────────────────────────
const sinput = document.getElementById('search-input');
const sresults = document.getElementById('search-results');
sinput.addEventListener('input', () => {
  const q = sinput.value.trim().toLowerCase();
  sresults.innerHTML = '';
  if(!q){ sresults.style.display='none'; return; }
  const hits = LOCS.map((l,i)=>({l,i})).filter(({l}) =>
    l.title.toLowerCase().includes(q) ||
    l.type.toLowerCase().includes(q) ||
    (l.desc||'').toLowerCase().includes(q) ||
    (l.char||'').toLowerCase().includes(q)
  ).slice(0,14);
  if(!hits.length){ sresults.style.display='none'; return; }
  hits.forEach(({l,i}) => {
    const c = COLORS[l.type] || '#aaa';
    const d = document.createElement('div');
    d.className = 'sr-item';
    d.innerHTML = `<div class="sr-name">${l.title}</div>
      <div class="sr-meta"><span class="sr-dot" style="background:${c}"></span>${l.type}${l.char?` · <span style="color:#f7c948">${l.char}</span>`:''}</div>`;
    d.onclick = () => {
      sresults.style.display='none'; sinput.value='';
      flyTo(i); showDetail(i);
      document.querySelectorAll('.tree-item').forEach(x=>x.classList.remove('active'));
      const treeItem = document.querySelector(`.tree-item[data-idx="${i}"]`);
      if(treeItem){
        // Ensure the parent items list is open
        const parentList = treeItem.closest('.tree-items');
        if(parentList && !parentList.classList.contains('open')) {
          parentList.classList.add('open');
          const parentHeader = parentList.previousElementSibling;
          if(parentHeader) parentHeader.classList.add('open');
        }
        treeItem.classList.add('active');
        treeItem.scrollIntoView({block:'nearest'});
      }
    };
    sresults.appendChild(d);
  });
  sresults.style.display = 'block';
});
document.addEventListener('click', e => {
  if(!sinput.contains(e.target) && !sresults.contains(e.target))
    sresults.style.display='none';
});

// ─── COORDS ───────────────────────────────────────────────────────────────────
map.on('mousemove', e => {
  document.getElementById('coords').textContent =
    `${e.latlng.lat.toFixed(2)}° ${e.latlng.lng.toFixed(2)}°  Z${map.getZoom()}`;
});
</script>
