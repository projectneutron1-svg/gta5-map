<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GTA V — San Andreas Interactive Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <!-- App styles (order matters: variables first, then base, then components) -->
  <link rel="stylesheet" href="src/css/variables.css"/>
  <link rel="stylesheet" href="src/css/base.css"/>
  <link rel="stylesheet" href="src/css/map.css"/>
  <link rel="stylesheet" href="src/css/sidebar.css"/>
  <link rel="stylesheet" href="src/css/tree.css"/>
  <link rel="stylesheet" href="src/css/detail-card.css"/>
  <link rel="stylesheet" href="src/css/leaflet-overrides.css"/>
</head>
<body>

  <div id="app">

    <!-- ── SIDEBAR ──────────────────────────────────────────────────────── -->
    <aside id="sidebar">

      <!-- Header: logo + search (CSS: #sb-header, #sb-logo) -->
      <div id="sb-header">
        <div id="sb-logo">
          <span class="icon">🗺</span>
          <h1>GTA V<small>San Andreas Interactive Map</small></h1>
        </div>

        <!-- Search (CSS: #search-wrap, #search-icon, #search-input, #search-results) -->
        <div id="search-wrap">
          <span id="search-icon">🔍</span>
          <input
            id="search-input"
            type="search"
            placeholder="Search locations, missions, collectibles…"
            autocomplete="off"
            aria-label="Search locations"
          />
          <div id="search-results" role="listbox" aria-label="Search results"></div>
        </div>
      </div>

      <!-- Progress (CSS: #progress-bar, .prog-row, .prog-label, .prog-count, .prog-track, .prog-fill, .prog-actions, .prog-btn) -->
      <div id="progress-bar">
        <div class="prog-row">
          <span class="prog-label">📋 Completion</span>
          <span id="prog-text" class="prog-count">0 / 0</span>
        </div>
        <div class="prog-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="prog-fill" class="prog-fill"></div>
        </div>
        <div class="prog-actions">
          <button id="btn-expand-all"   class="prog-btn">▼ Expand All</button>
          <button id="btn-collapse-all" class="prog-btn">▶ Collapse All</button>
        </div>
      </div>

      <!-- Category tree (CSS: #tree-wrap) -->
      <div id="tree-wrap"></div>

      <!-- Detail card (CSS: #detail-card, #detail-inner) -->
      <div id="detail-card">
        <button id="dc-close" aria-label="Close detail">✕</button>
        <div id="detail-inner">
          <div id="dc-tag"></div>
          <div id="dc-title"></div>
          <div id="dc-char"></div>
          <div id="dc-desc"></div>
          <div id="dc-imgs" role="list"></div>
        </div>
      </div>

    </aside>

    <!-- ── MAP ──────────────────────────────────────────────────────────── -->
    <main id="map-wrap">
      <div id="map"></div>

      <!-- Tile switcher + controls (CSS: #map-controls, #tile-row, .mc-btn) -->
      <div id="map-controls">
        <div id="tile-row">
          <button class="mc-btn active" data-t="sat">🛰 Satellite</button>
          <button class="mc-btn"        data-t="road">🛣 Road</button>
        </div>
      </div>

      <!-- Coordinate readout (CSS: #coords) -->
      <div id="coords">Hover for coords</div>
    </main>

  </div>


  <!-- ═══════════════════════════════════════════════════════════════
       SCRIPTS — load order: Leaflet → data → storage → map →
                 markers → detail → tree → search → main
  ════════════════════════════════════════════════════════════════ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Data -->
  <script src="src/js/data/colors.js"></script>
  <script src="src/js/data/categories.js"></script>
  <script src="src/js/data/locations.js"></script>

  <!-- Core modules -->
  <script src="src/js/storage.js"></script>
  <script src="src/js/map.js"></script>
  <script src="src/js/markers.js"></script>
  <script src="src/js/detail.js"></script>
  <script src="src/js/tree.js"></script>
  <script src="src/js/search.js"></script>
  <script src="src/js/main.js"></script>

</body>
</html>
