<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GTA V – San Andreas Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
/* ── DESIGN TOKENS ── */
:root {
  --bg:#0d1117; --sidebar:#0d1117; --panel:#161b22;
  --border:rgba(255,255,255,0.07); --hover:rgba(255,255,255,0.04);
  --text:#e6edf3; --muted:#8b949e; --accent:#f7c948; --radius:10px;
  --sidebar-w:360px; --rp-width:460px;
  --color-bg-p:#161b22; --color-bg-s:rgba(255,255,255,0.05);
  --color-bg-t:rgba(255,255,255,0.08); --color-border:rgba(255,255,255,0.07);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);}

/* ── LAYOUT ── */
#app{display:flex;height:100vh;width:100vw;overflow:hidden;background:var(--bg);}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100%;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border);z-index:10;overflow:hidden;position:relative;flex-shrink:0;}

/* Map fills all remaining space — Leaflet owns this completely */
#map-wrap{flex:1 1 0%;min-width:0;height:100%;position:relative;overflow:hidden;background:var(--bg);}
#map{position:absolute;inset:0;background:var(--bg);}

/* RIGHT PANEL: flex sibling — pushes map left when open, collapses to zero when hidden */
#right-panel{
  flex:0 0 var(--rp-width);
  width:var(--rp-width);
  min-width:var(--rp-width);
  height:100%;
  display:flex;flex-direction:column;
  background:#0d1117;
  border-left:1px solid rgba(255,255,255,0.12);
  z-index:10;
  overflow:hidden;
  transition:width .3s ease, min-width .3s ease, flex-basis .3s ease, opacity .2s ease;
  opacity:1;
}
#right-panel.rp-hidden{
  flex-basis:0!important;
  width:0!important;
  min-width:0!important;
  opacity:0;
  pointer-events:none;
  border:none;
}

/* ── SIDEBAR HEADER ── */
#sb-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0;}
#sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#sb-logo .icon{font-size:22px;}
#sb-logo h1{font-size:15px;font-weight:800;letter-spacing:.3px;color:var(--accent);}
#sb-logo h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0;}
#search-wrap{position:relative;}
#search-input{width:100%;height:36px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:0 12px 0 34px;outline:none;transition:border-color .2s;}
#search-input:focus{border-color:rgba(247,201,72,.4);}
#search-input::placeholder{color:var(--muted);}
#search-input::-webkit-search-cancel-button{-webkit-appearance:none;}
#search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}
#search-results{display:none;margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:220px;overflow-y:auto;position:relative;z-index:200;}
#search-results::-webkit-scrollbar{width:3px;}
#search-results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.sr-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s;}
.sr-item:last-child{border:none;}
.sr-item:hover{background:rgba(255,255,255,.06);}
.sr-name{font-size:12px;font-weight:600;color:var(--text);}
.sr-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;}
.sr-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}

/* ── PROGRESS BAR ── */
#progress-bar{padding:10px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.prog-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.prog-count{font-size:11px;color:var(--accent);font-weight:700;}
.prog-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#f7c948,#fb923c);border-radius:2px;transition:width .4s ease;}
.prog-actions{display:flex;gap:6px;margin-top:8px;}
.prog-btn{flex:1;height:24px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.3px;transition:background .15s;}
.prog-btn:hover{background:rgba(255,255,255,.09);color:var(--text);}

/* ── TREE ── */
#tree-wrap{flex:1;overflow-y:auto;padding:8px 0;}

#tree-wrap::-webkit-scrollbar{width:3px;}
#tree-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}
.tree-cat{margin-bottom:2px;}
.tree-cat-header{display:flex;align-items:center;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.3px;transition:background .12s;user-select:none;gap:8px;}
.tree-cat-header:hover{background:rgba(255,255,255,.04);}
.tree-cat-header .cat-arrow{margin-left:auto;font-size:10px;color:var(--muted);transition:transform .2s;transform:rotate(0deg);}
.tree-cat-header.open .cat-arrow{transform:rotate(90deg);}
.tree-cat-header .cat-check{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(255,255,255,.2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tree-cat-header .cat-check.checked{border-color:currentColor;background:currentColor;}
.tree-cat-header .cat-check.checked::after{content:'✓';font-size:9px;color:#000;font-weight:900;}
.cat-count{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px;}
.tree-items{display:none;padding:0 0 4px 0;}
.tree-items.open{display:block;}
.tree-item{display:flex;align-items:center;padding:6px 16px 6px 40px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .1s;gap:8px;border-left:2px solid transparent;}
.tree-item:hover{background:var(--hover);color:var(--text);border-left-color:rgba(255,255,255,.15);}
.tree-item.active{background:rgba(255,255,255,.06);color:var(--text);}
.tree-item .item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tree-item .item-name{flex:1;line-height:1.3;}
.item-done{width:13px;height:13px;border-radius:3px;border:1.5px solid rgba(255,255,255,.15);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-left:auto;}
.item-done:hover{border-color:rgba(52,211,153,.5);}
.item-done.checked{background:#34d399;border-color:#34d399;}
.item-done.checked::after{content:'✓';font-size:7px;color:#000;font-weight:900;}

/* detail card removed – right panel handles all location details */

/* ── MAP CONTROLS ── */
/* Tile toggle: absolute top-right inside the map-wrap, always visible */
#map-controls{position:absolute;top:12px;right:12px;z-index:2000;display:flex;gap:5px;align-items:center;}
.mc-btn{height:32px;padding:0 14px;background:rgba(18,20,26,0.96);border:1px solid rgba(255,255,255,0.13);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;backdrop-filter:blur(12px);}
.mc-btn:hover{background:rgba(255,255,255,.08);}
.mc-btn.active{background:rgba(247,201,72,.15);border-color:rgba(247,201,72,.4);color:var(--accent);}
#tile-row{display:flex;gap:5px;}
#coords{position:absolute;bottom:8px;right:8px;z-index:1000;background:rgba(10,12,16,0.88);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:10px;font-family:monospace;color:var(--muted);pointer-events:none;}

/* right panel additional styles */
#rp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
#rp-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
#rp-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:background .15s,color .15s;}
#rp-close:hover{background:rgba(255,255,255,.08);color:var(--text);}
#rp-body{flex:1;overflow-y:auto;padding:0 16px 24px;}
#rp-body::-webkit-scrollbar{width:4px;}
#rp-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

/* ── LEAFLET OVERRIDES ── */
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;}
.leaflet-control-zoom a{background:rgba(10,12,16,.92)!important;color:#c9d1d9!important;border-bottom:1px solid var(--border)!important;width:30px!important;height:30px!important;line-height:30px!important;}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.1)!important;}
.leaflet-control-attribution{background:rgba(10,12,16,.7)!important;color:#444!important;font-size:9px!important;}
.leaflet-popup-content-wrapper{background:#161b22!important;border:1px solid var(--border)!important;border-radius:12px!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;min-width:180px;}
.leaflet-popup-tip{background:#161b22!important;}
.leaflet-popup-content{margin:0!important;color:var(--text)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;top:8px!important;right:8px!important;font-size:16px!important;}
.lpu{padding:12px 14px;}
.lpu-tag{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;}
.lpu-title{font-size:12px;font-weight:700;line-height:1.35;margin-bottom:4px;}
.lpu-char{font-size:10px;color:var(--accent);margin-bottom:3px;}
.lpu-hint{font-size:10px;color:var(--muted);}
.type-row{display:flex;align-items:center;padding:4px 16px;gap:8px;}
/* Ensure Leaflet's own container fills the #map div completely */
.leaflet-container{width:100%!important;height:100%!important;background:var(--bg)!important;}
  </style>
</head>
<body>
<div id="app">
  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">
    <div id="sb-header">
      <div id="sb-logo">
        <span class="icon">🗺</span>
        <h1>GTA V<small>San Andreas Interactive Map</small></h1>
      </div>
      <div id="search-wrap">
        <span id="search-icon">🔍</span>
        <input id="search-input" type="search" placeholder="Search locations, missions, collectibles…" autocomplete="off"/>
        <div id="search-results"></div>
      </div>
    </div>
    <div id="progress-bar">
      <div class="prog-row">
        <span class="prog-label">📋 Completion</span>
        <span id="prog-text" class="prog-count">0 / 0</span>
      </div>
      <div class="prog-track"><div id="prog-fill" class="prog-fill"></div></div>
      <div class="prog-actions">
        <button id="btn-expand-all" class="prog-btn">▼ Expand All</button>
        <button id="btn-collapse-all" class="prog-btn">▶ Collapse All</button>
      </div>
    </div>
    <div id="tree-wrap"></div>
  </aside>

  <!-- MAP: fills all remaining space -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="coords">Hover for coords</div>
  </div>

  <!-- RIGHT PANEL: fixed overlay, independent of map -->
  <aside id="right-panel" class="rp-hidden">
    <div id="rp-header">
      <span id="rp-title">Mission Info</span>
      <button id="rp-close">✕</button>
    </div>
    <div id="rp-body"></div>
  </aside>

  <!-- Tile toggle: fixed top-right, always visible -->
  <div id="map-controls">
    <div id="tile-row">
      <button class="mc-btn active" data-t="sat">🛰 Satellite</button>
      <button class="mc-btn" data-t="road">🛣 Road</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

/**
 * Returns the best representative colour for a location object.
 * Prefers character colour for story missions; falls back to type colour.
 *
 * @param {object} loc – A location entry from LOCS.
 * @returns {string} CSS hex colour.
 */
function getMissionColor(loc) {
  if (loc.char && CHAR_COLORS[loc.char]) return CHAR_COLORS[loc.char];
  return COLORS[loc.type] || '#aaaaaa';
}

/**
 * src/js/storage.js
 *
 * Thin wrapper around localStorage for persisting completion state.
 * Stores a JSON-serialised array of completed location indices.
 */

const STORAGE_KEY = 'gtav_map_done_v2';

/**
 * Load the set of completed location indices from localStorage.
 * Returns an empty Set if the key is missing or the data is corrupt.
 *
 * @returns {Set<number>}
 */
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  } catch (_) {
    return new Set();
  }
}

/**
 * Persist the current completion Set to localStorage.
 *
 * @param {Set<number>} set
 */
function saveDone(set) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
  } catch (_) {
    // Storage may be full or unavailable – fail silently.
  }
}


// ════════════════════════════════════════════════════════════
// 3. MAP INIT
// ════════════════════════════════════════════════════════════
const BOUNDS_SW  = [54, -162];
const BOUNDS_NE  = [88, -83];
const MAP_BOUNDS = L.latLngBounds(BOUNDS_SW, BOUNDS_NE);

const map = L.map('map', {
  minZoom: 3, maxZoom: 7, zoomControl: true,
  maxBounds: MAP_BOUNDS, maxBoundsViscosity: 1.0,
});
map.zoomControl.setPosition('bottomright');

const TILE_BASE = 'https://gta5-map.github.io/tiles';
const tSat  = L.tileLayer(`${TILE_BASE}/satellite/{z}-{x}_{y}.png`, { tileSize:256,maxZoom:7,minZoom:3,noWrap:true,bounds:MAP_BOUNDS,attribution:'© GTA V tiles' });
const tRoad = L.tileLayer(`${TILE_BASE}/road/{z}-{x}_{y}.png`,      { tileSize:256,maxZoom:7,minZoom:3,noWrap:true,bounds:MAP_BOUNDS,attribution:'© GTA V tiles' });
tSat.addTo(map);
let activeTile = 'sat';
map.setView([71, -122], 3);
// After layout settles, fit the tile bounds with a small padding for thin borders
setTimeout(() => {
  map.invalidateSize();
  map.fitBounds(MAP_BOUNDS, { padding: [8, 8] });
}, 100);

document.querySelectorAll('[data-t]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.t === activeTile) return;
    (activeTile === 'sat' ? tSat : tRoad).removeFrom(map);
    activeTile = btn.dataset.t;
    (activeTile === 'sat' ? tSat : tRoad).addTo(map);
    document.querySelectorAll('[data-t]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

map.on('mousemove', e => {
  document.getElementById('coords').textContent =
    `${e.latlng.lat.toFixed(2)}°  ${e.latlng.lng.toFixed(2)}°  Z${map.getZoom()}`;
});

window.addEventListener('resize',   () => map.invalidateSize());
map.on('zoomend',  () => map.invalidateSize());
map.on('zoomstart', () => setTimeout(() => map.invalidateSize(), 50));
setTimeout(() => map.invalidateSize(), 150);

// ════════════════════════════════════════════════════════════
// 4. COMPLETION STATE
// ════════════════════════════════════════════════════════════
const doneSet = loadDone();

function updateProgress() {
  const total = LOCS.length, done = doneSet.size;
  document.getElementById('prog-text').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = total ? `${(done/total)*100}%` : '0%';
}
updateProgress();

/**
 * src/js/markers.js
 *
 * Builds and manages all Leaflet markers: icon creation, layer groups,
 * popup binding, and icon refresh when completion state changes.
 *
 * Depends on: map, LOCS, COLORS, EMOJI, getMissionColor, doneSet
 * Exports: `groups`, `markerMap`, `mkIcon`, `refreshMarkerIcon`
 */

const MARKER_SIZE = 12; // px diameter of each dot marker

/**
 * Build a circular div icon for a marker.
 *
 * @param {object|string} locOrType – Full loc object (preferred) or type string.
 * @param {boolean}       done      – Whether this location is completed.
 * @returns {L.DivIcon}
 */
function mkIcon(locOrType, done) {
  const colour =
    typeof locOrType === 'object'
      ? getMissionColor(locOrType)
      : (COLORS[locOrType] || '#aaaaaa');

  const opacity = done ? '0.4' : '1';
  const filter  = done ? 'filter:grayscale(80%);' : '';
  const s       = MARKER_SIZE;

  return L.divIcon({
    html: `<div style="
      width:${s}px;height:${s}px;border-radius:50%;
      background:${colour};
      border:2px solid rgba(0,0,0,0.6);
      box-shadow:0 0 6px ${colour}99;
      cursor:pointer;
      opacity:${opacity};
      ${filter}
    "></div>`,
    className:    '',
    iconSize:     [s, s],
    iconAnchor:   [s / 2, s / 2],
    popupAnchor:  [0, -8],
  });
}

// ── Layer groups (one per type) ───────────────────────────────────────────────
const typeList = [...new Set(LOCS.map((l) => l.type))].sort();
const groups   = {};

typeList.forEach((t) => {
  groups[t] = L.layerGroup().addTo(map);
});

// ── Marker index map (location index → Leaflet marker) ───────────────────────
const markerMap = new Map();

LOCS.forEach((loc, idx) => {
  const isDone = doneSet.has(idx);
  const colour = getMissionColor(loc);
  const marker = L.marker([loc.lat, loc.lng], { icon: mkIcon(loc, isDone) });

  marker.bindPopup(
    `<div class="lpu">
      <div class="lpu-tag" style="color:${colour}">${EMOJI[loc.type] || '📍'} ${loc.type}</div>
      <div class="lpu-title">${loc.title}</div>
      ${loc.char ? `<div class="lpu-char">Character: ${loc.char}</div>` : ''}
      <div class="lpu-hint">Click sidebar entry for details</div>
    </div>`,
    { maxWidth: 240 }
  );

  marker.on('click', () => showDetail(idx));
  marker.addTo(groups[loc.type]);
  markerMap.set(idx, marker);
});

/**
 * Refresh the icon for a single marker after its done-state changes.
 *
 * @param {number} idx – Index into LOCS.
 */
function refreshMarkerIcon(idx) {
  const m = markerMap.get(idx);
  if (m) m.setIcon(mkIcon(LOCS[idx], doneSet.has(idx)));
}

const rightPanel = document.getElementById('right-panel');
const rpBody     = document.getElementById('rp-body');
const rpClose    = document.getElementById('rp-close');
const rpTitle    = document.getElementById('rp-title');

function openRightPanel(idx) {
  const loc  = LOCS[idx];
  const card = CARDS[loc.title];
  rpTitle.textContent = loc.title;
  rightPanel.classList.remove('rp-hidden');
  if (card) {
    rpBody.innerHTML = card;
  } else {
    const colour = getMissionColor(loc);
    rpBody.innerHTML = `
      <div style="padding:1.5rem 0;">
        <div style="background:var(--color-bg-p);border:0.5px solid var(--color-border);border-radius:12px;overflow:hidden;">
          <div style="background:#1a1a2e;padding:1.25rem 1.5rem;border-bottom:0.5px solid rgba(255,255,255,0.08);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
              <span style="font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:${colour};background:${colour}20;border:0.5px solid ${colour}40;border-radius:4px;padding:2px 8px;">${loc.type}</span>
              ${loc.char ? `<span style="font-size:10px;color:rgba(255,255,255,0.4);">Character: ${loc.char}</span>` : ''}
            </div>
            <h2 style="font-size:20px;font-weight:500;color:#fff;margin:0 0 6px;">${loc.title}</h2>
            <p style="font-size:13px;color:rgba(255,255,255,0.5);margin:0;line-height:1.5;">${loc.desc || 'No description available.'}</p>
          </div>
          <div style="padding:1.25rem 1.5rem;">
            <div style="background:rgba(247,201,72,0.06);border:0.5px solid rgba(247,201,72,0.2);border-radius:8px;padding:10px 12px;">
              <p style="font-size:12px;color:var(--muted);margin:0;line-height:1.5;">📝 Detailed card not yet added for this location.</p>
            </div>
          </div>
        </div>
      </div>`;
  }
  // Shift Leaflet's usable area left so markers aren't hidden under the panel
  setTimeout(() => {
    map.invalidateSize({ pan: false });
  }, 310);
}

function closeRightPanel() {
  rightPanel.classList.add('rp-hidden');
  rpBody.innerHTML = '';
  setTimeout(() => {
    map.invalidateSize({ pan: false });
  }, 310);
}

rpClose.addEventListener('click', closeRightPanel);

// ════════════════════════════════════════════════════════════
// 8. INTERACTION (flyTo, showDetail → right panel only)
// ════════════════════════════════════════════════════════════
let _popupTimer  = null;

function flyTo(idx) {
  const loc  = LOCS[idx];
  const zoom = ZOOM_FOR_TYPE[loc.type] || 6;
  map.flyTo([loc.lat, loc.lng], zoom, { duration:0.8 });
}

function showDetail(idx) {
  flyTo(idx);
  openRightPanel(idx);
  if (_popupTimer) clearTimeout(_popupTimer);
  _popupTimer = setTimeout(() => { const m = markerMap.get(idx); if(m) m.openPopup(); _popupTimer=null; }, 850);
}

function closeDetail() {
  document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
  if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer=null; }
}


// ════════════════════════════════════════════════════════════
// 9. SIDEBAR TREE
// ════════════════════════════════════════════════════════════
/**
 * src/js/tree.js
 *
 * Builds the sidebar category tree and wires all interactions:
 *   - category collapse/expand
 *   - category-level visibility checkboxes
 *   - type-level visibility checkboxes
 *   - per-item completion checkboxes
 *   - item click → flyTo + showDetail
 *   - Expand All / Collapse All buttons
 *
 * Depends on: map, LOCS, COLORS, EMOJI, CAT_GROUPS, groups, typeList,
 *             doneSet, saveDone, updateProgress, refreshMarkerIcon,
 *             flyTo, showDetail
 */

const treeWrap = document.getElementById('tree-wrap');

/** Tracks which type layers are currently visible on the map. */
const activeTypes = new Set(typeList);

// ── Tree builder ──────────────────────────────────────────────────────────────

function buildTree() {
  treeWrap.innerHTML = '';

  Object.entries(CAT_GROUPS).forEach(([groupName, types]) => {
    const validTypes = types.filter((t) => typeList.includes(t));
    if (!validTypes.length) return;

    const totalCount = validTypes.reduce(
      (sum, t) => sum + LOCS.filter((l) => l.type === t).length,
      0
    );

    // ── Category container ──
    const catDiv = document.createElement('div');
    catDiv.className = 'tree-cat';

    // ── Category header ──
    const header = document.createElement('div');
    header.className = 'tree-cat-header open';

    // Category-level checkbox
    const check = document.createElement('div');
    check.className = 'cat-check checked';
    if (!validTypes.every((t) => activeTypes.has(t))) {
      check.classList.remove('checked');
    }

    const labelSpan = document.createElement('span');
    labelSpan.innerHTML = `${groupName} <span class="cat-count">${totalCount}</span>`;

    const arrow = document.createElement('span');
    arrow.className  = 'cat-arrow';
    arrow.textContent = '▶';

    header.append(check, labelSpan, arrow);

    // ── Items list (starts open) ──
    const itemsList = document.createElement('div');
    itemsList.className = 'tree-items open';

    // ── Sync parent checkbox ──
    const syncParentCheck = () => {
      if (validTypes.every((t) => activeTypes.has(t))) {
        check.classList.add('checked');
      } else {
        check.classList.remove('checked');
      }
    };

    // ── Category checkbox handler ──
    check.addEventListener('click', (e) => {
      e.stopPropagation();
      const isChecked = check.classList.contains('checked');

      if (isChecked) {
        check.classList.remove('checked');
        validTypes.forEach((t) => {
          activeTypes.delete(t);
          map.removeLayer(groups[t]);
        });
        itemsList.querySelectorAll('.type-check').forEach((tc) => tc.classList.remove('checked'));
      } else {
        check.classList.add('checked');
        validTypes.forEach((t) => {
          activeTypes.add(t);
          groups[t].addTo(map);
        });
        itemsList.querySelectorAll('.type-check').forEach((tc) => tc.classList.add('checked'));
      }
    });

    // ── Category header collapse toggle ──
    header.addEventListener('click', (e) => {
      if (e.target === check) return;
      const isOpen = itemsList.classList.contains('open');
      itemsList.classList.toggle('open', !isOpen);
      header.classList.toggle('open', !isOpen);
    });

    // ── Type rows ──
    validTypes.forEach((type) => {
      const colour  = COLORS[type] || '#aaaaaa';
      const typeLocs = LOCS.filter((l) => l.type === type);
      const count    = typeLocs.length;

      // Type row wrapper
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;padding:4px 16px;gap:8px;';

      // Type-level checkbox
      const tc = document.createElement('div');
      tc.className  = 'cat-check type-check';
      tc.style.cssText = [
        `width:13px;height:13px;border-radius:3px;`,
        `border:1.5px solid ${colour};`,
        `flex-shrink:0;display:flex;align-items:center;justify-content:center;`,
        `cursor:pointer;transition:all .15s;`,
      ].join('');

      const checkMark = document.createElement('span');
      checkMark.style.cssText = 'font-size:8px;color:#000;font-weight:900;';
      tc.appendChild(checkMark);

      const updateTypeCheck = () => {
        const on = activeTypes.has(type);
        tc.style.background  = on ? colour : 'transparent';
        checkMark.textContent = on ? '✓' : '';
      };
      updateTypeCheck();

      tc.addEventListener('click', () => {
        if (activeTypes.has(type)) {
          activeTypes.delete(type);
          map.removeLayer(groups[type]);
        } else {
          activeTypes.add(type);
          groups[type].addTo(map);
        }
        updateTypeCheck();
        syncParentCheck();
      });

      // Type label
      const typeLabel = document.createElement('div');
      typeLabel.style.cssText =
        'font-size:11px;flex:1;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:default;';
      typeLabel.innerHTML =
        `<span style="width:6px;height:6px;border-radius:50%;background:${colour};display:inline-block;flex-shrink:0;"></span>` +
        `<span>${EMOJI[type] || ''} ${type}</span>`;

      // Count badge
      const countBadge = document.createElement('span');
      countBadge.style.cssText = 'font-size:10px;color:var(--muted);font-weight:400;';
      countBadge.textContent = count;

      row.append(tc, typeLabel, countBadge);
      itemsList.appendChild(row);

      // ── Individual location items (skip very large sets) ──
      if (typeLocs.length > 0 && typeLocs.length <= 60) {
        typeLocs.forEach((loc) => {
          const realIdx = LOCS.indexOf(loc);
          const item    = document.createElement('div');
          item.className    = 'tree-item';
          item.dataset.idx  = realIdx;
          if (doneSet.has(realIdx)) item.style.opacity = '0.45';

          item.innerHTML =
            `<div class="item-dot" style="background:${colour}"></div>` +
            `<span class="item-name">${loc.title}</span>` +
            `<div class="item-done${doneSet.has(realIdx) ? ' checked' : ''}"></div>`;

          // Name/dot click → fly + detail
          item.addEventListener('click', (e) => {
            if (e.target.classList.contains('item-done')) return;
            document.querySelectorAll('.tree-item').forEach((x) => x.classList.remove('active'));
            item.classList.add('active');
            flyTo(realIdx);
            showDetail(realIdx);
          });

          // Completion checkbox click
          item.querySelector('.item-done').addEventListener('click', (e) => {
            e.stopPropagation();
            const box = e.target;

            if (doneSet.has(realIdx)) {
              doneSet.delete(realIdx);
              box.classList.remove('checked');
              item.style.opacity = '1';
            } else {
              doneSet.add(realIdx);
              box.classList.add('checked');
              item.style.opacity = '0.45';
            }

            saveDone(doneSet);
            updateProgress();
            refreshMarkerIcon(realIdx);
          });

          itemsList.appendChild(item);
        });
      }
    });

    catDiv.append(header, itemsList);
    treeWrap.appendChild(catDiv);
  });
}

buildTree();

// ── Expand / Collapse All ─────────────────────────────────────────────────────

document.getElementById('btn-expand-all').addEventListener('click', () => {
  document.querySelectorAll('.tree-items').forEach((el) => el.classList.add('open'));
  document.querySelectorAll('.tree-cat-header').forEach((el) => el.classList.add('open'));
});

document.getElementById('btn-collapse-all').addEventListener('click', () => {
  document.querySelectorAll('.tree-items').forEach((el) => el.classList.remove('open'));
  document.querySelectorAll('.tree-cat-header').forEach((el) => el.classList.remove('open'));
});


buildTree();

const btnExp = document.getElementById('btn-expand-all');
const btnCol = document.getElementById('btn-collapse-all');
if(btnExp) btnExp.onclick = () => {
  document.querySelectorAll('.tree-items').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.tree-cat-header').forEach(el => el.classList.add('open'));
};
if(btnCol) btnCol.onclick = () => {
  document.querySelectorAll('.tree-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.tree-cat-header').forEach(el => el.classList.remove('open'));
};

// ════════════════════════════════════════════════════════════
// 10. SEARCH
// ════════════════════════════════════════════════════════════
/**
 * src/js/search.js
 *
 * FIXED: Use requestAnimationFrame after expanding the tree parent so
 * the DOM has settled before scrollIntoView fires, preventing the
 * scroll landing in the wrong position.
 *
 * Handles the search input and results dropdown in the sidebar header.
 */

const searchInput   = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

const MAX_RESULTS = 14;

searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';

  if (!query) {
    searchResults.style.display = 'none';
    return;
  }

  const hits = LOCS
    .map((loc, idx) => ({ loc, idx }))
    .filter(({ loc }) =>
      loc.title.toLowerCase().includes(query) ||
      loc.type.toLowerCase().includes(query)  ||
      (loc.desc || '').toLowerCase().includes(query) ||
      (loc.char || '').toLowerCase().includes(query)
    )
    .slice(0, MAX_RESULTS);

  if (!hits.length) {
    searchResults.style.display = 'none';
    return;
  }

  hits.forEach(({ loc, idx }) => {
    const colour = COLORS[loc.type] || '#aaaaaa';
    const item   = document.createElement('div');
    item.className  = 'sr-item';
    item.role       = 'option';
    item.innerHTML  =
      `<div class="sr-name">${loc.title}</div>` +
      `<div class="sr-meta">
        <span class="sr-dot" style="background:${colour}"></span>
        ${loc.type}
        ${loc.char ? `· <span style="color:#f7c948">${loc.char}</span>` : ''}
      </div>`;

    item.addEventListener('click', () => selectResult(idx));
    searchResults.appendChild(item);
  });

  searchResults.style.display = 'block';
});

/**
 * Select a result: hide dropdown, fly map, show detail, highlight tree item.
 * BUG FIX: use requestAnimationFrame after expanding the parent to ensure
 * the DOM has reflowed before scrollIntoView runs.
 * @param {number} idx – Index into LOCS.
 */
function selectResult(idx) {
  searchResults.style.display = 'none';
  searchInput.value = '';

  flyTo(idx);
  showDetail(idx);

  document.querySelectorAll('.tree-item').forEach((el) => el.classList.remove('active'));

  const treeItem = document.querySelector(`.tree-item[data-idx="${idx}"]`);
  if (treeItem) {
    const parentList = treeItem.closest('.tree-items');
    if (parentList && !parentList.classList.contains('open')) {
      parentList.classList.add('open');
      const parentHeader = parentList.previousElementSibling;
      if (parentHeader) parentHeader.classList.add('open');
    }
    treeItem.classList.add('active');
    // BUG FIX: wait for expand animation before scrolling
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        treeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    });
  }
}

document.addEventListener('click', (e) => {
  if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchResults.style.display = 'none';
    searchInput.blur();
  }
});


// ════════════════════════════════════════════════════════════
// 11. AUTO-OPEN PALETO SCORE ON LOAD
// ════════════════════════════════════════════════════════════
setTimeout(() => {
  const idx = LOCS.findIndex(l => l.title === 'The Paleto Score');
  if (idx !== -1) openRightPanel(idx);
}, 300);

</script>
